<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>E-Bus App - Sign Up</title>
  <link rel="stylesheet" href="style1.css">
</head>
<body>
  <div class="container">
    <h2>Create Account</h2>
    <form>
      <label for="fullname">Username</label><br>
      <input type="text" placeholder="Username" required><br>
      <label for="fullname">Email</label><br>
      <input type="email" placeholder="Email" required><br>
      <label for="fullname">Password</label><br>
      <input type="password" placeholder="Password" required><br>
      <label for="fullname">Confirm Password</label><br>
      <input type="password" placeholder="Confirm Password" required><br>
      <button type="submit">Sign Up</button>
    </form>
    <p>Already have an account? <a href="login page shuttle service.html">Login</a></p>
  </div>
  <script src="Signup.js"></script>
</body>
</html>
